scalar DateTime

enum BookingStatus {
  BOOKED
  CANCELLED
  ATTENDED
  NO_SHOW
  CANCELLED_BY_CLUB
}

enum UserRole {
  CLIENT
  TRAINER
  ADMIN
}

enum ScheduleStatus {
  PLANNED
  COMPLETED
  CANCELLED
}

enum SubscriptionStatus {
  PENDING
  ACTIVE
  EXPIRED
  CANCELLED
}

enum PaymentStatus {
  PENDING
  COMPLETED
  FAILED
}

type Query {
  me: UserProfile!
  schedule(filter: ScheduleFilterInput): [ScheduleItem!]!
  trainerSchedule(trainerId: ID!, from: DateTime, to: DateTime): [ScheduleItem!]!
  myBookings(status: BookingStatus): [BookingItem!]!
  mySubscriptions: [SubscriptionItem!]!
  myPayments: [PaymentItem!]!
  myNotifications(unreadOnly: Boolean = false): [NotificationItem!]!
  analytics(filter: AnalyticsFilterInput!): AnalyticsReport!
}

type Mutation {
  registerUser(input: RegisterUserInput!): AuthPayload!
  login(input: LoginInput!): AuthPayload!
  createClass(input: CreateClassInput!): ClassItem!
  updateClass(input: UpdateClassInput!): ClassItem!
  createSchedule(input: CreateScheduleInput!): ScheduleItem!
  changeScheduleStatus(input: ChangeScheduleStatusInput!): ScheduleItem!
  purchaseSubscription(input: PurchaseSubscriptionInput!): SubscriptionPurchasePayload!
  confirmPayment(input: ConfirmPaymentInput!): PaymentItem!
  bookSchedule(input: BookScheduleInput!): BookingItem!
  cancelBooking(input: CancelBookingInput!): BookingItem!
  markAttendance(input: MarkAttendanceInput!): BookingItem!
}

type AuthPayload {
  accessToken: String!
  user: UserProfile!
}

type SubscriptionPurchasePayload {
  subscription: SubscriptionItem!
  payment: PaymentItem!
}

type UserProfile {
  id: ID!
  email: String!
  role: UserRole!
  client: ClientProfile
  trainer: TrainerProfile
}

type ClientProfile {
  id: ID!
  fullName: String!
  phone: String!
  membershipStatus: String!
}

type TrainerProfile {
  id: ID!
  fullName: String!
  phone: String!
  specialization: String!
  employmentStatus: String!
}

type ClassItem {
  id: ID!
  title: String!
  description: String
  durationMinutes: Int!
  capacity: Int!
  categoryId: ID!
  trainerId: ID!
  status: String!
}

type ScheduleItem {
  id: ID!
  classId: ID!
  hallId: ID!
  trainerId: ID!
  startTime: DateTime!
  endTime: DateTime!
  status: ScheduleStatus!
  availableSlots: Int!
}

type SubscriptionItem {
  id: ID!
  clientId: ID!
  planId: ID!
  startDate: String
  endDate: String
  remainingVisits: Int!
  status: SubscriptionStatus!
}

type PaymentItem {
  id: ID!
  clientId: ID!
  subscriptionId: ID!
  amount: Float!
  currency: String!
  paymentMethod: String!
  status: PaymentStatus!
  paidAt: DateTime
}

type BookingItem {
  id: ID!
  clientId: ID!
  scheduleId: ID!
  subscriptionId: ID!
  status: BookingStatus!
  bookedAt: DateTime!
  cancelledAt: DateTime
  attendanceMarkedAt: DateTime
}

type NotificationItem {
  id: ID!
  type: String!
  channel: String!
  title: String!
  message: String!
  status: String!
  createdAt: DateTime!
  sentAt: DateTime
}

type AnalyticsReport {
  totalRevenue: Float!
  totalBookings: Int!
  totalAttendance: Int!
  hallLoad: [HallLoadItem!]!
  popularClasses: [PopularClassItem!]!
  activeClients: [ActiveClientItem!]!
}

type HallLoadItem {
  hallId: ID!
  statDate: String!
  totalSlots: Int!
  bookedSlots: Int!
  attendedCount: Int!
}

type PopularClassItem {
  classId: ID!
  bookingsCount: Int!
  cancellationsCount: Int!
  attendanceCount: Int!
}

type ActiveClientItem {
  clientId: ID!
  bookingsCount: Int!
  attendanceCount: Int!
  cancellationsCount: Int!
}

input RegisterUserInput {
  email: String!
  password: String!
  role: UserRole!
  fullName: String!
  phone: String!
  birthDate: String
  specialization: String
}

input LoginInput {
  email: String!
  password: String!
}

input CreateClassInput {
  title: String!
  description: String
  durationMinutes: Int!
  capacity: Int!
  categoryId: ID!
  trainerId: ID!
}

input UpdateClassInput {
  id: ID!
  title: String
  description: String
  durationMinutes: Int
  capacity: Int
  categoryId: ID
  trainerId: ID
  status: String
}

input CreateScheduleInput {
  classId: ID!
  hallId: ID!
  trainerId: ID!
  startTime: DateTime!
  endTime: DateTime!
}

input ChangeScheduleStatusInput {
  scheduleId: ID!
  status: ScheduleStatus!
}

input PurchaseSubscriptionInput {
  clientId: ID!
  planId: ID!
  paymentMethod: String!
}

input ConfirmPaymentInput {
  paymentId: ID!
  status: PaymentStatus!
}

input BookScheduleInput {
  clientId: ID!
  scheduleId: ID!
  subscriptionId: ID!
}

input CancelBookingInput {
  bookingId: ID!
}

input MarkAttendanceInput {
  bookingId: ID!
  status: BookingStatus!
}

input ScheduleFilterInput {
  trainerId: ID
  categoryId: ID
  startDate: DateTime
  endDate: DateTime
  status: ScheduleStatus
}

input AnalyticsFilterInput {
  fromDate: String!
  toDate: String!
}