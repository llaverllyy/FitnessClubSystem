spring.application.name=FitnessClubSystem

spring.datasource.url=jdbc:h2:mem:fitness;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.graphql.graphiql.enabled=true
spring.graphql.schema.printer.enabled=true
spring.graphql.schema.file-extensions=.graphqls,.gqls,.graphql

app.demo.current-user-id=11111111-1111-1111-1111-111111111101
app.demo.current-client-id=22222222-2222-2222-2222-222222222201